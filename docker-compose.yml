services:
  db:
    image: postgres:16
    container_name: f1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-f1_etl}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
